version: 2

# One pull request per ecosystem per week, majors included. They are reviewed
# and merged together with `oss update --merge`, which is what keeps two repos
# built from the same template from drifting apart.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
