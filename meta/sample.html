<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weekend loaf: the schedule</title>
<style>
  body { margin: 0; font: 16px/1.5 Georgia, serif; color: #2b2622; background: #f6f1e8; }
  header { padding: 36px 40px 24px; background: #2b2622; color: #f6f1e8; }
  header p { margin: 0; font: 12px/1 ui-monospace, Menlo, monospace; letter-spacing: .14em; color: #d9a35b; }
  h1 { margin: 10px 0 0; font-size: 34px; font-weight: normal; }
  main { padding: 28px 40px 40px; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 26px; }
  .step { background: #fff; border-radius: 10px; padding: 14px; box-shadow: 0 1px 2px #0002; }
  .step b { display: block; font: 600 22px/1 ui-monospace, Menlo, monospace; color: #b5651d; }
  .step span { font-size: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th { text-align: left; font: 11px ui-monospace, Menlo, monospace; letter-spacing: .12em; color: #8a7f74; padding: 6px 0; }
  td { padding: 9px 0; border-top: 1px solid #e3d9ca; }
  th:last-child, td:last-child { text-align: right; font-family: ui-monospace, Menlo, monospace; }
  svg { display: block; margin-top: 22px; }
</style>
</head>
<body>
<header>
  <p>SATURDAY / SOURDOUGH / 75% HYDRATION</p>
  <h1>Weekend loaf: the schedule</h1>
</header>
<main>
  <div class="steps">
    <div class="step"><b>09:00</b><span>Feed the starter</span></div>
    <div class="step"><b>13:00</b><span>Mix and rest</span></div>
    <div class="step"><b>14:00</b><span>Four folds</span></div>
    <div class="step"><b>18:00</b><span>Shape, then cold</span></div>
  </div>
  <table>
    <tr><th>INGREDIENT</th><th>GRAMS</th></tr>
    <tr><td>Bread flour</td><td>450</td></tr>
    <tr><td>Whole wheat</td><td>50</td></tr>
    <tr><td>Water</td><td>375</td></tr>
    <tr><td>Starter</td><td>100</td></tr>
    <tr><td>Salt</td><td>10</td></tr>
  </table>
  <svg width="100%" height="70" viewBox="0 0 400 70" preserveAspectRatio="none">
    <path d="M0 62 C60 60 90 50 130 42 S220 18 280 12 S360 8 400 7" fill="none" stroke="#b5651d" stroke-width="2.5"/>
    <text x="0" y="10" font-family="Menlo, monospace" font-size="9" fill="#8a7f74">RISE OVER THE DAY</text>
  </svg>
</main>
</body>
</html>
